# 类型: 用户配置
# 说明: Agent主配置文件，控制Agent的核心行为

# LLM配置
llm:
  provider: "anthropic"  # anthropic | openai | azure | local
  model: "claude-sonnet-4-20250514"
  api_key: "${ANTHROPIC_API_KEY}"  # 从环境变量读取
  base_url: null  # 自定义API端点（本地模型需要）
  max_tokens: 4096
  temperature: 0.7

# Agent配置
agent:
  name: "cool-agent"
  description: "一个通用智能Agent系统，支持CLI和Web双模式"
  max_turns: 50
  context_window: 200000

# 工具配置
tools:
  enabled:
    - "file_tools"
    - "network_tools"
    - "bash_tools"
  disabled: []

# 权限配置
permissions:
  mode: "ask"  # allow | deny | ask
  rules:
    - pattern: "Bash(rm -rf *)"
      action: "deny"
    - pattern: "Bash(sudo *)"
      action: "deny"
    - pattern: "Bash(dd *)"
      action: "deny"
    - pattern: "Bash(mkfs *)"
      action: "deny"

# 沙箱配置
sandbox:
  enabled: true
  allowed_directories:
    - "workspace/"
    - "memory/"
    - "skills/"
  denied_patterns:
    - ".env"
    - ".env.*"
    - "*.key"
    - "*.pem"
    - "secrets/"

# 记忆配置
memory:
  enabled: true
  storage: "memory/"
  max_size: "100MB"
  auto_compact: true

# 日志配置
logging:
  level: "info"  # debug | info | warning | error
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/agent.log"

# 可观测性配置
observability:
  enabled: true
  service_name: "cool-agent"
  traces:
    enabled: true
    exporter: "otlp"  # otlp | console | jaeger
    endpoint: "http://localhost:4317"
  metrics:
    enabled: true
    exporter: "otlp"
    endpoint: "http://localhost:4317"
    export_interval: 60000
  logs:
    enabled: true
    format: "json"  # json | text
    level: "info"

# 沙箱执行配置（OpenSandbox）
sandbox_execution:
  enabled: true
  provider: "opensandbox"  # opensandbox | local
  image: "opensandbox/code-interpreter:v1.0.2"
  max_pool_size: 3
  timeout: 600
  network:
    enabled: true
    egress_policy: "allow"  # allow | deny | restricted

# 浏览器自动化配置
browser:
  enabled: true
  headless: true
  default_timeout: 30
  max_steps: 15
  screenshot_on_error: true

# Web服务配置
web:
  enabled: true
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "*"
